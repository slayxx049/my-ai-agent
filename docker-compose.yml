services:
  database:
    image: pgvector/pgvector:pg17
    container_name: omni-memory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omni-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-omni}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - omni_pgdata:/var/lib/postgresql/data
      - ./backend/init/001-pgvector.sql:/docker-entrypoint-initdb.d/001-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omni} -d ${POSTGRES_DB:-omni}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  omni_pgdata:
